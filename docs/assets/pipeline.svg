<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">Lexical analyzer construction pipeline</title>
  <desc id="desc">Token regular expressions become NFAs, then a combined DFA, then a maximal-munch scanner.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c0a09"/>
      <stop offset="1" stop-color="#1c1917"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#a8a29e"/>
    </marker>
  </defs>
  <rect width="1200" height="320" rx="28" fill="url(#bg)"/>
  <g font-family="Inter,Segoe UI,Arial,sans-serif">
    <text x="60" y="60" fill="#f5f5f4" font-size="26" font-weight="700">From token rules to a working scanner</text>
    <text x="60" y="91" fill="#a8a29e" font-size="16">The same pipeline used by the Python implementation and visualized in the browser.</text>
    <g filter="url(#shadow)">
      <rect x="60" y="135" width="210" height="115" rx="16" fill="#292524" stroke="#f59e0b" stroke-width="2"/>
      <text x="165" y="174" text-anchor="middle" fill="#fbbf24" font-size="14" font-weight="700" letter-spacing="1">TOKEN RULES</text>
      <text x="165" y="207" text-anchor="middle" fill="#fafaf9" font-family="Consolas,monospace" font-size="17">ID = [A-Za-z]...</text>
      <text x="165" y="232" text-anchor="middle" fill="#d6d3d1" font-size="13">ordered by priority</text>
      <rect x="350" y="135" width="210" height="115" rx="16" fill="#292524" stroke="#60a5fa" stroke-width="2"/>
      <text x="455" y="174" text-anchor="middle" fill="#93c5fd" font-size="14" font-weight="700" letter-spacing="1">EPSILON-NFA</text>
      <circle cx="416" cy="211" r="14" fill="none" stroke="#fafaf9" stroke-width="2"/>
      <circle cx="494" cy="211" r="18" fill="none" stroke="#86efac" stroke-width="4"/>
      <path d="M431 211 H471" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="452" y="202" text-anchor="middle" fill="#d6d3d1" font-size="12">a</text>
      <rect x="640" y="135" width="210" height="115" rx="16" fill="#292524" stroke="#a78bfa" stroke-width="2"/>
      <text x="745" y="174" text-anchor="middle" fill="#c4b5fd" font-size="14" font-weight="700" letter-spacing="1">DFA</text>
      <circle cx="706" cy="211" r="14" fill="none" stroke="#fafaf9" stroke-width="2"/>
      <circle cx="784" cy="211" r="18" fill="none" stroke="#86efac" stroke-width="4"/>
      <path d="M721 211 H761" stroke="#d6d3d1" stroke-width="2" marker-end="url(#arrow)"/>
      <text x="742" y="202" text-anchor="middle" fill="#d6d3d1" font-size="12">a-z</text>
      <rect x="930" y="135" width="210" height="115" rx="16" fill="#292524" stroke="#34d399" stroke-width="2"/>
      <text x="1035" y="174" text-anchor="middle" fill="#6ee7b7" font-size="14" font-weight="700" letter-spacing="1">SCANNER</text>
      <text x="1035" y="207" text-anchor="middle" fill="#fafaf9" font-family="Consolas,monospace" font-size="18">"if" -&gt; KW_IF</text>
      <text x="1035" y="232" text-anchor="middle" fill="#d6d3d1" font-size="13">maximal munch</text>
    </g>
    <g stroke="#a8a29e" stroke-width="3" fill="none" marker-end="url(#arrow)">
      <path d="M285 192 H330"/>
      <path d="M575 192 H620"/>
      <path d="M865 192 H910"/>
    </g>
    <g fill="#78716c" font-size="12" text-anchor="middle">
      <text x="307" y="177">Thompson</text>
      <text x="597" y="177">subsets</text>
      <text x="887" y="177">simulate</text>
    </g>
  </g>
</svg>
